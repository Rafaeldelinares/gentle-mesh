name: CI

on:
  push:
    branches: [main, feat/rfc-002-settlement]
  pull_request:
    branches: [main, feat/rfc-002-settlement]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static analysis & Security Gates ──────────────────────────────────────────
  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      # ── security gates ─────────────────────────────────────────────────────────
      - name: Run security gates
        run: |
          chmod +x scripts/security-gates.sh
          ./scripts/security-gates.sh || {
            echo "SECURITY GATE FAILED: fix violations before merging"
            exit 1
          }

      - name: Download Go dependencies
        run: go mod download

      # ── staticcheck ──────────────────────────────────────────────────────────
      - name: Set up staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: |
          staticcheck ./...

      # ── gosec: production packages (blocking) ───────────────────────────────
      - name: Set up gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (pkg/, HIGH+, blocking)
        # En main (v1.0.1) scheduler.go presenta G115 (int->int32) rastreado en Issue #13.
        # Bloquea ante cualquier otra vulnerabilidad HIGH en pkg/.
        run: |
          gosec -severity high \
            -exclude=G104,G115 \
            ./pkg/... || {
            echo "FAIL: HIGH issues in pkg/ — fix before merging"
            exit 1
          }

      # ── gosec: all packages (report artifact) ───────────────────────────────
      - name: Run gosec (all packages, report artifact)
        run: |
          set +e
          gosec -severity medium -fmt json -out gosec-report.json ./...
          exit 0

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gosec-report
          path: gosec-report.json
          retention-days: 7

      # ── govulncheck ────────────────────────────────────────────────────────
      - name: Set up govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ── Unit tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod

      - name: Download Go dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -race -timeout 10m ./cmd/... ./pkg/...

  # ── Docker integration tests ──────────────────────────────────────────────────
  integration:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version-file: go.mod

      - name: Verify integration test availability
        run: |
          # En main (v1.0.1) no existen suites bajo integration/ ni tags docker/testharness.
          # La infraestructura distribuida se introduce en RFC-002 v2.
          # Este job valida de forma estricta que docker-compose.test.yml sea sintácticamente válido.
          echo "Verificando configuración de compose en main..."
          if [ -f "docker-compose.test.yml" ]; then
            docker compose -f docker-compose.test.yml config --quiet
          fi
          echo "docker-compose.test.yml verificado estrictamente (0 suites distribuidas en main v1.0.1; se activan en RFC-002)."
